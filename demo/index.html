<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰箱私厨</title>
<style>body{font:16px system-ui,'Microsoft YaHei';margin:0;background:#f3f3eb;color:#264435}header{background:#234b3e;color:white;padding:30px 6%}main{max-width:1100px;margin:25px auto;padding:0 20px;display:grid;grid-template-columns:300px 1fr;gap:24px}section{background:white;border:1px solid #dde3d9;border-radius:16px;padding:22px;margin-bottom:20px}textarea,input,select{font:inherit;padding:12px;border:1px solid #cad3c8;border-radius:8px;box-sizing:border-box;width:100%;margin:8px 0}textarea{min-height:100px}button{font:inherit;padding:12px;background:#295d49;color:white;border:0;border-radius:8px;cursor:pointer;margin:6px 5px 6px 0}button:disabled{opacity:.5}p,li{line-height:1.8}small{color:#67756a}h2{font-size:21px}.stock{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.notice{padding:18px;background:#eee5ce;border-radius:10px}#status{white-space:pre-wrap}@media(max-width:760px){main{grid-template-columns:1fr}aside{order:2}}</style>
<header><p>PANTRY / YOUR EVERYDAY KITCHEN</p><h1>冰箱私厨</h1><p>记住家里的食材，让每一顿都有着落。</p></header>
<main><aside><section><h2>我的冰箱</h2><small>保存在本机，重启后仍保留。</small><div id="pantry"></div></section><section><h2>盘点 / 补货</h2><select id="mode" aria-label="操作模式"><option value="set">盘点：设置列出食材余量</option><option value="add">补货：增加买回数量</option></select><textarea id="stockText" aria-label="食材" placeholder="鸡蛋4个，番茄2个，油100克，盐20克"></textarea><button id="preview">核对食材</button><p><small>支持克、千克、斤、个、根。个/根按示例重量估算。油盐也需录入。未列出的食材保留。</small></p></section><section><details><summary>库存流水与对话记忆</summary><div id="history"></div></details></section></aside>
<article><section><h2>今天想吃什么？</h2><label>用餐人数<input id="people" type="number" min="1" max="20" value="2"></label><button id="recommend">用现有食材推荐</button><textarea id="message" aria-label="告诉私厨" placeholder="我家有鸡蛋4个，番茄2个，油100克，盐20克"></textarea><button id="send">告诉私厨</button><button id="example">填入示例</button><p><small>试试「给3个人做饭」「我想做饭」「补货鸡蛋6个」「家里还有什么」。首版是规则式对话，暂不支持任意自然语言。</small></p></section><section aria-live="polite"><div id="status">先告诉我冰箱里有什么，再为你推荐。</div><div id="draft"></div></section><div id="recipes"></div><p class="notice">营养数值为未逐条核验的演示估算，以每人每道菜计，不代表完整一餐。首版不处理疾病、过敏或保质期约束，食材存储安全需自行确认。</p></article></main>
<script>
const $=id=>document.getElementById(id);
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
async function request(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const b=await r.json();if(!r.ok)throw Error(b.error||'请求失败');return b;}
async function refresh(){const s=await request('/api/state');$('pantry').replaceChildren();if(!s.pantry.length)$('pantry').append(el('p','还没有库存'));s.pantry.forEach(i=>{const n=el('div');n.className='stock';n.append(el('span',i.name),el('b',`${Math.round(i.grams*100)/100}克`));$('pantry').append(n);});$('people').value=s.people;$('history').replaceChildren();s.events.forEach(e=>{const p=JSON.parse(e.payload);$('history').append(el('p',`${e.created} · ${e.kind==='cook'?'做饭：'+p.title:e.kind==='add'?'补货':'盘点'}`));});s.messages.forEach(m=>$('history').append(el('p',m.body)));}
async function action(path,data){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{render(await request(path,data));await refresh();}catch(e){$('status').textContent=e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function render(r){$('status').textContent=r.message||'操作完成';$('draft').replaceChildren();if(r.type==='preview'){r.draft.items.forEach(i=>$('draft').append(el('p',`${i.name} ${i.grams}克${i.estimated?'（估重，可改用克数）':''}`)));const b=el('button','确认保存库存');b.onclick=()=>action('/api/apply',{id:r.draft.id});$('draft').append(b);}if(r.type==='recipes'){$('recipes').replaceChildren();r.recipes.forEach(p=>{const c=el('section');c.append(el('h2',p.title),el('p',`${p.people}人份 · 约${p.minutes}分钟`),el('p',Object.entries(p.ingredients).map(([k,v])=>`${k} ${v}克`).join(' / ')));const n=p.nutrition_per_person;c.append(el('p',`每人估算：${n.kcal??'未知'} kcal · 蛋白质 ${n.protein_g??'未知'}g · 脂肪 ${n.fat_g??'未知'}g · 碳水 ${n.carbs_g??'未知'}g`));const steps=el('ol');p.steps.forEach(s=>steps.append(el('li',s)));const b=el('button','已按此用量做完 · 扣减库存');b.onclick=()=>action('/api/cook',{id:p.id});c.append(steps,b);$('recipes').append(c);});if(r.unavailable.length){const d=el('details');d.append(el('summary','其他菜为何不匹配'));r.unavailable.forEach(p=>d.append(el('p',p.title+'：'+p.missing.join('，'))));$('recipes').append(d);}}}
$('preview').onclick=()=>action('/api/preview',{text:$('stockText').value,mode:$('mode').value});$('recommend').onclick=()=>action('/api/recommend',{people:Number($('people').value)});$('send').onclick=()=>action('/api/chat',{text:$('message').value});$('example').onclick=()=>{$('message').value='我家有鸡蛋4个，番茄2个，油100克，盐20克';};refresh().catch(e=>$('status').textContent=e.message);
</script></html>
